name: Discord Quest Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Create .env file
        run: echo "TOKEN=${{ secrets.TOKEN }}" > .env
      
      - name: Run Discord Quest Bot
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run github